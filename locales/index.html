window.dash={colors:['#2f6fb0','#f08a24','#3a9d6e','#8a5bb5','#c4483f','#2aa3b8','#b8a02a','#7a7a7a'],
 calc:(id,o)=>{defs.push([id,o]);store[id]=o.fn(...o.inputs.map(i=>store[i]));},
 recalc:l=>{base(l);defs.forEach(([id,o])=>{store[id]=o.fn(...o.inputs.map(i=>store[i]));});},
 data:id=>store[id]?{status:'ok',data:store[id]}:{status:'missing',data:[]},
 onData:fn=>{fn();let w=window.innerWidth,t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>{if(window.innerWidth!==w){w=window.innerWidth;fn();}},150);});}};
})();
</script>

<div class="pn" id="pn">
  <div class="hd"><div class="ttl">PARIS NIGHT LOCALES</div></div>
  <div class="tabs" id="loc"></div>
  <div id="view"></div>
  <p class="note foot">Actualizado: 20/10/2026 13:53</p>
  <div class="bar" id="tabs"></div>
</div>
<script>
const GOAL=5e6;
dash.calc('porDia',{inputs:['ordenes'],title:'Venta por día',description:'Venta, órdenes y ticket de cada día.',
 fn:(ordenes)=>{const m={};ordenes.forEach(r=>{const x=m[r.fecha]=m[r.fecha]||{fecha:r.fecha,venta:0,ordenes:0};x.venta+=+r.venta;x.ordenes++;});
  return Object.values(m).map(x=>({fecha:x.fecha,venta:x.venta,ordenes:x.ordenes,ticket:Math.round(x.venta/x.ordenes)}));}});
dash.calc('porHora',{inputs:['ordenes'],title:'Venta por hora',description:'Venta y órdenes por día y hora.',
 fn:(ordenes)=>{const m={};ordenes.forEach(r=>{const k=r.fecha+'|'+r.hora;const x=m[k]=m[k]||{fecha:r.fecha,hora:+r.hora,venta:0,ordenes:0};x.venta+=+r.venta;x.ordenes++;});return Object.values(m);}});
dash.calc('porArtDia',{inputs:['lineas'],title:'Artículos por día',description:'Unidades y venta de cada artículo por día.',
 fn:(lineas)=>{const m={};lineas.forEach(r=>{const k=r.fecha+'|'+r.item;const x=m[k]=m[k]||{fecha:r.fecha,item:r.item,articulo:r.articulo,unidades:0,venta:0};x.articulo=r.articulo;x.unidades+=+r.cantidad;x.venta+=+r.venta;});return Object.values(m);}});
dash.calc('porArtMes',{inputs:['lineas'],title:'Artículos por mes',description:'Unidades y venta de cada artículo por mes.',
 fn:(lineas)=>{const m={};lineas.forEach(r=>{const mes=r.fecha.slice(0,7);const k=mes+'|'+r.item;const x=m[k]=m[k]||{mes:mes,item:r.item,articulo:r.articulo,unidades:0,venta:0};x.articulo=r.articulo;x.unidades+=+r.cantidad;x.venta+=+r.venta;});return Object.values(m);}});
dash.calc('porMes',{inputs:['porDia'],title:'Venta por mes',description:'Venta, órdenes, ticket y venta por día de cada mes.',
 fn:(porDia)=>{const m={};porDia.forEach(r=>{const k=r.fecha.slice(0,7);const x=m[k]=m[k]||{mes:k,venta:0,ordenes:0,dias:0};x.venta+=+r.venta;x.ordenes+=+r.ordenes;x.dias++;});
  return Object.values(m).map(x=>({mes:x.mes,venta:x.venta,ordenes:x.ordenes,dias:x.dias,porDia:Math.round(x.venta/x.dias),ticket:Math.round(x.venta/x.ordenes)}));}});

 
dash.calc('provDia',{inputs:['ciudades'],title:'Venta por provincia y día',description:'Órdenes y venta por provincia de destino y día.',
 fn:(ciudades)=>{const m={};ciudades.forEach(r=>{const k=r.fecha+'|'+r.provincia;const x=m[k]=m[k]||{fecha:r.fecha,provincia:r.provincia,ordenes:0,venta:0};x.ordenes+=+r.ordenes;x.venta+=+r.venta;});return Object.values(m);}});
dash.calc('provMes',{inputs:['ciudades'],title:'Venta por provincia y mes',description:'Órdenes y venta por provincia de destino y mes.',
 fn:(ciudades)=>{const m={};ciudades.forEach(r=>{const mes=r.fecha.slice(0,7);const k=mes+'|'+r.provincia;const x=m[k]=m[k]||{mes:mes,provincia:r.provincia,ordenes:0,venta:0};x.ordenes+=+r.ordenes;x.venta+=+r.venta;});return Object.values(m);}});
dash.calc('ciuMes',{inputs:['ciudades'],title:'Venta por ciudad y mes',description:'Órdenes y venta por ciudad de destino y mes.',
 fn:(ciudades)=>{const m={};ciudades.forEach(r=>{const mes=r.fecha.slice(0,7);const k=mes+'|'+r.provincia+'|'+r.ciudad;const x=m[k]=m[k]||{mes:mes,provincia:r.provincia,ciudad:r.ciudad,ordenes:0,venta:0};x.ordenes+=+r.ordenes;x.venta+=+r.venta;});return Object.values(m);}});
const S={tab:'diario',sub:'resumen',fecha:null,mes:null,local:'todos'};
const D={};
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const fm=n=>'$ '+d3.format(',.0f')(n).replace(/,/g,'.');
const fK=v=>v===0?'0':(v>=1e6?(v/1e6)+'M':(v/1e3)+'k');
const el=(t,c,x,a)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(a)for(const k in a)e.setAttribute(k,a[k]);return e;};
const utc=f=>new Date(f+'T12:00:00Z');
const addDays=(f,n)=>{const d=utc(f);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const longDate=f=>{const d=utc(f);return DIA[d.getUTCDay()]+' '+d.getUTCDate()+' de '+MES[d.getUTCMonth()]+' '+d.getUTCFullYear();};
const monthLabel=m=>MES[+m.slice(5)-1]+' '+m.slice(0,4);

function bars(host,rows,o){
  host.textContent='';host.style.position='relative';
  const W=host.clientWidth||340,H=o.h||200,m={t:8,r:6,b:22,l:o.l||36};
  const ticks=d3.ticks(0,o.max,4);
  const svg=d3.select(host).append('svg').attr('width','100%').attr('viewBox',`0 0 ${W} ${H}`);
  const x=d3.scaleBand(rows.map((r,i)=>i),[m.l,W-m.r]).padding(.18);
  const y=d3.scaleLinear([0,o.max],[H-m.b,m.t]);
  svg.append('g').selectAll('line').data(ticks).join('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',d=>y(d)).attr('y2',d=>y(d)).attr('stroke','var(--cds-chart-grid)').attr('stroke-dasharray','3 3');
  svg.append('g').selectAll('text').data(ticks).join('text').attr('x',m.l-5).attr('y',d=>y(d)+4).attr('text-anchor','end').attr('fill','var(--color-fg-muted)').attr('font-size',10).text(fK);
  const tip=el('div','tip');
  const show=(ev,r)=>{tip.textContent=r.tip;tip.style.display='block';const b=host.getBoundingClientRect();const px=Math.min(Math.max(ev.clientX-b.left,70),b.width-70);tip.style.left=px+'px';tip.style.top=Math.max(0,y(r.value)-34)+'px';};
  svg.append('g').selectAll('rect').data(rows).join('rect').attr('x',(r,i)=>x(i)).attr('width',x.bandwidth()).attr('y',r=>y(r.value)).attr('height',r=>Math.max(0,y(0)-y(r.value))).attr('rx',3).attr('fill',r=>r.hi?'var(--bar-hi)':'var(--bar)')
    .on('pointermove',show).on('pointerdown',show).on('pointerleave',()=>{tip.style.display='none';});
  if(o.goal)svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(o.goal)).attr('y2',y(o.goal)).attr('stroke','var(--cds-chart-reference)').attr('stroke-dasharray','4 4');
  svg.append('g').selectAll('text').data(rows.map((r,i)=>[r,i]).filter(d=>d[0].lab)).join('text').attr('x',d=>x(d[1])+x.bandwidth()/2).attr('y',H-7).attr('text-anchor','middle').attr('fill','var(--color-fg-muted)').attr('font-size',10).text(d=>d[0].lab);
  host.appendChild(tip);
}
function table(cols,rows,src,keyCols,keyFn){
  const t=el('table',null,null,{'data-source':src,'data-row-key':keyCols});
  const hr=el('tr');cols.forEach(c=>hr.appendChild(el('th',null,c.h,{'data-field':c.f})));t.appendChild(el('thead')).appendChild(hr);
  const tb=el('tbody');rows.forEach(r=>{const tr=el('tr',null,null,{'data-key':keyFn(r)});cols.forEach(c=>tr.appendChild(el('td',c.cls||null,c.fmt?c.fmt(r[c.f]):r[c.f])));tb.appendChild(tr);});t.appendChild(tb);return t;}
const ek=(...p)=>p.map(encodeURIComponent).join(',');
function hero(label,value,src,field,where){
  const h=el('div','hero');h.style.background='var(--hero)';h.appendChild(el('div','lbl',label));
  const a={};if(where){a['data-source']=src;a['data-field']=field;a['data-where']=where;}
  h.appendChild(el('span','big',value,a));return h;}
function mini(label,value,src,field,where){
  const c=el('div','card');c.appendChild(el('div','lbl',label));const a={};if(where){a['data-source']=src;a['data-field']=field;a['data-where']=where;}
  c.appendChild(el('span','big',value,a));return c;}

function load(){
  const g=i=>dash.data(i);
  D.dia=new Map(g('porDia').data.map(r=>[r.fecha,{fecha:r.fecha,venta:+r.venta,ordenes:+r.ordenes,ticket:+r.ticket}]));
  D.hora=g('porHora').data.map(r=>({fecha:r.fecha,hora:+r.hora,venta:+r.venta,ordenes:+r.ordenes}));
  D.artDia=g('porArtDia').data.map(r=>({fecha:r.fecha,item:r.item,articulo:r.articulo,unidades:+r.unidades,venta:+r.venta}));
  D.artMes=g('porArtMes').data.map(r=>({mes:r.mes,item:r.item,articulo:r.articulo,unidades:+r.unidades,venta:+r.venta}));
  D.mes=g('porMes').data.map(r=>({mes:r.mes,venta:+r.venta,ordenes:+r.ordenes,dias:+r.dias,porDia:+r.porDia,ticket:+r.ticket})).sort((a,b)=>a.mes<b.mes?-1:1);
  D.ciu=g('ciudades').data.map(r=>({fecha:r.fecha,provincia:r.provincia,ciudad:r.ciudad,ordenes:+r.ordenes,venta:+r.venta}));
  D.provDia=g('provDia').data.map(r=>({fecha:r.fecha,provincia:r.provincia,ordenes:+r.ordenes,venta:+r.venta}));
  D.provMes=g('provMes').data.map(r=>({mes:r.mes,provincia:r.provincia,ordenes:+r.ordenes,venta:+r.venta}));
  D.ciuMes=g('ciuMes').data.map(r=>({mes:r.mes,provincia:r.provincia,ciudad:r.ciudad,ordenes:+r.ordenes,venta:+r.venta}));
  const fs=[...D.dia.keys()].sort();D.min=fs[0];D.max=fs[fs.length-1];
  if(!S.fecha){S.fecha=D.max;S.mes=D.max.slice(0,7);}
}
const artCols=[{f:'articulo',h:'Artículo',cls:'art'},{f:'unidades',h:'Un.',fmt:v=>d3.format(',')(v).replace(/,/g,'.')},{f:'venta',h:'Venta',fmt:fm}];

function cityBlock(v,kind,key){
  const dia=kind==='dia';
  const prov=(dia?D.provDia.filter(r=>r.fecha===key):D.provMes.filter(r=>r.mes===key)).sort((a,b)=>b.venta-a.venta);
  const ciu=(dia?D.ciu.filter(r=>r.fecha===key):D.ciuMes.filter(r=>r.mes===key)).sort((a,b)=>b.venta-a.venta).slice(0,25);
  const c=el('div','card');c.appendChild(el('h2',null,'Por local'));c.appendChild(el('p','note','Porcentaje sobre la venta del '+(dia?'día':'mes')+'.'));
  if(!prov.length){c.appendChild(el('p','note','Sin ventas.'));v.appendChild(c);return;}
  const tot=d3.sum(prov,r=>r.venta),mx=prov[0].venta;
  const list=el('div',null,null,{'data-source':dia?'provDia':'provMes'});
  prov.slice(0,8).forEach(r=>{const row=el('div');row.style.margin='8px 0';
    const t=el('div');t.style.cssText='display:flex;justify-content:space-between;gap:8px';t.appendChild(el('span',null,r.provincia));t.appendChild(el('span','lbl',fm(r.venta)+' · '+Math.round(r.venta/tot*100)+'%'));
    const bar=el('div');bar.style.cssText='height:8px;border-radius:4px;background:var(--color-border-line);margin-top:3px';
    const fill=el('div');fill.style.cssText='height:8px;border-radius:4px;width:'+(r.venta/mx*100)+'%;background:var(--bar-hi)';bar.appendChild(fill);row.append(t,bar);list.appendChild(row);});
  c.appendChild(list);v.appendChild(c);
  const c2=el('div','card');c2.appendChild(el('h2',null,'Por caja'));c2.appendChild(el('p','note','Venta de cada caja.'));
  const cols=[{f:'ciudad',h:'Caja',cls:'art'},{f:'provincia',h:'Local'},{f:'ordenes',h:'Ventas'},{f:'venta',h:'Venta',fmt:fm}];
  const bx=el('div','box');bx.appendChild(table(cols,ciu,dia?'ciudades':'ciuMes',dia?'fecha,provincia,ciudad':'mes,provincia,ciudad',r=>ek(dia?r.fecha:r.mes,r.provincia,r.ciudad)));c2.appendChild(bx);v.appendChild(c2);
}
function horBlock(v,from,to){
  const ok=f=>f>=from&&f<=to&&f<D.max;
  const days=[...D.dia.values()].filter(r=>ok(r.fecha));
  if(!days.length){v.appendChild(el('div','card')).appendChild(el('p','note','Sin días completos en este período.'));return;}
  const n=days.length,byH={};D.hora.filter(r=>ok(r.fecha)).forEach(r=>{byH[r.hora]=(byH[r.hora]||0)+r.venta;});
  const hr=d3.range(24).map(h=>({value:(byH[h]||0)/n,lab:h%3===0?String(h):'',tip:h+' a '+(h+1)+' h · '+fm((byH[h]||0)/n)+' por día'}));
  const mh=d3.max(hr,r=>r.value);hr.forEach(r=>{if(mh>0&&r.value===mh)r.hi=true;});
  const c=el('div','card');c.appendChild(el('h2',null,'Venta promedio por hora'));c.appendChild(el('p','note','Promedio de '+n+' días completos (hora Argentina). En otro color, la hora más fuerte.'));
  const ch=el('div',null,null,{'data-source':'porHora'});ch.style.minHeight='200px';c.appendChild(ch);v.appendChild(c);
  bars(ch,hr,{max:Math.max(mh||1,1)*1.1});
  const DS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],acc=d3.range(7).map(()=>({s:0,n:0}));
  days.forEach(r=>{const w=new Date(r.fecha+'T12:00:00').getDay();acc[w].s+=r.venta;acc[w].n++;});
  const wk=[1,2,3,4,5,6,0].map(w=>({value:acc[w].n?acc[w].s/acc[w].n:0,lab:DS[w],tip:DS[w]+' · '+fm(acc[w].n?acc[w].s/acc[w].n:0)+' promedio ('+acc[w].n+' días)'}));
  const mw=d3.max(wk,r=>r.value);wk.forEach(r=>{if(mw>0&&r.value===mw)r.hi=true;});
  const c2=el('div','card');c2.appendChild(el('h2',null,'Venta promedio por día de la semana'));c2.appendChild(el('p','note','Mismo período. En otro color, el día más fuerte.'));
  const ch2=el('div',null,null,{'data-source':'porDia'});ch2.style.minHeight='200px';c2.appendChild(ch2);v.appendChild(c2);
  bars(ch2,wk,{max:Math.max(mw||1,1)*1.1});
}
function subTabs(v){const sub=el('div','tabs');[['resumen','Resumen'],['articulos','Artículos'],['ciudades','Locales'],['horarios','Horarios']].forEach(([k,t])=>{const b=el('button','btn'+(S.sub===k?' on':''),t);b.onclick=()=>{S.sub=k;render();};sub.appendChild(b);});v.appendChild(sub);}
function dayBody(v,f){
  const d=D.dia.get(f),w='fecha='+f;
  if(S.sub==='resumen'){
    v.appendChild(hero('Venta del día',fm(d?d.venta:0),'porDia','venta',d?w:null));
    const two=el('div','two');two.append(mini('Cantidad de ventas',d?d.ordenes:0,'porDia','ordenes',d?w:null),mini('Ticket promedio',fm(d?d.ticket:0),'porDia','ticket',d?w:null));v.appendChild(two);
    const hs=D.hora.filter(r=>r.fecha===f),byH={};hs.forEach(r=>byH[r.hora]=r);
    const rows=d3.range(24).map(h=>({value:byH[h]?byH[h].venta:0,lab:h%3===0?String(h):'',tip:h+' a '+(h+1)+' h · '+fm(byH[h]?byH[h].venta:0)+' · '+(byH[h]?byH[h].ordenes:0)+' ventas'}));
    const mx=d3.max(rows,r=>r.value);rows.forEach(r=>{if(mx>0&&r.value===mx)r.hi=true;});
    const c=el('div','card');c.appendChild(el('h2',null,'Evolución por rango horario'));c.appendChild(el('p','note','Venta por hora del día (hora Argentina). En otro color, la hora más fuerte.'));
    const ch=el('div',null,null,{'data-source':'porHora'});ch.style.minHeight='200px';c.appendChild(ch);v.appendChild(c);
    bars(ch,rows,{max:Math.max(d3.max(rows,r=>r.value)||1,1)*1.1});
  }else if(S.sub==='articulos'){
    const rows=D.artDia.filter(r=>r.fecha===f).sort((a,b)=>b.venta-a.venta).slice(0,40);
    const c=el('div','card');c.appendChild(el('h2',null,'Artículos del día'));c.appendChild(el('p','note','Top 40 por venta.'));
    const bx=el('div','box');bx.appendChild(rows.length?table(artCols,rows,'porArtDia','fecha,item',r=>ek(r.fecha,r.item)):el('p','note','Sin ventas ese día.'));c.appendChild(bx);v.appendChild(c);
  }else if(S.sub==='horarios'){
    v.appendChild(el('p','note','28 días hasta '+longDate(f)+'. El día en curso no se cuenta (está incompleto).'));horBlock(v,addDays(f,-27),f);
  }else cityBlock(v,'dia',f);
}
function viewDia(v){
  const nav=el('div','nav');
  const pv=el('button','btn','‹');pv.onclick=()=>{if(S.fecha>D.min){S.fecha=addDays(S.fecha,-1);render();}};
  const nx=el('button','btn','›');nx.onclick=()=>{if(S.fecha<D.max){S.fecha=addDays(S.fecha,1);render();}};
  const mid=el('div','cur');mid.appendChild(el('div',null,longDate(S.fecha)));
  const inp=el('input',null,null,{type:'date',min:D.min,max:D.max,value:S.fecha});inp.onchange=()=>{if(inp.value>=D.min&&inp.value<=D.max){S.fecha=inp.value;render();}};mid.appendChild(inp);
  nav.append(pv,mid,nx);v.appendChild(nav);subTabs(v);dayBody(v,S.fecha);
}
function viewMes(v){
  const ms=D.mes.map(r=>r.mes),i=ms.indexOf(S.mes);
  const nav=el('div','nav');const pv=el('button','btn','‹');pv.onclick=()=>{if(i>0){S.mes=ms[i-1];render();}};const nx=el('button','btn','›');nx.onclick=()=>{if(i<ms.length-1){S.mes=ms[i+1];render();}};
  nav.append(pv,el('div','cur',monthLabel(S.mes)),nx);v.appendChild(nav);subTabs(v);
  const m=D.mes[i],w='mes='+S.mes;
  if(S.sub==='resumen'){
  v.appendChild(hero('Venta del mes',fm(m.venta),'porMes','venta',w));
  v.lastChild.appendChild(el('div','lbl',fm(m.porDia)+' por día · '+m.dias+' días'));
  const two=el('div','two');two.append(mini('Cantidad de ventas',d3.format(',')(m.ordenes).replace(/,/g,'.'),'porMes','ordenes',w),mini('Ticket promedio',fm(m.ticket),'porMes','ticket',w));v.appendChild(two);
  const days=[...D.dia.values()].filter(r=>r.fecha.slice(0,7)===S.mes).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const rows=days.map(r=>({value:r.venta,lab:(+r.fecha.slice(8))%5===0||r.fecha.slice(8)==='01'?String(+r.fecha.slice(8)):'',tip:r.fecha.slice(8)+'/'+r.fecha.slice(5,7)+' · '+fm(r.venta)+' · '+r.ordenes+' ventas'}));
  const c=el('div','card');c.appendChild(el('h2',null,'Venta por día'));c.appendChild(el('p','note','Venta de cada día.'));
  const ch=el('div',null,null,{'data-source':'porDia'});ch.style.minHeight='200px';c.appendChild(ch);v.appendChild(c);
  bars(ch,rows,{max:Math.max(d3.max(rows,r=>r.value)||1,1)*1.1});
  }else if(S.sub==='articulos'){
  const top=D.artMes.filter(r=>r.mes===S.mes).sort((a,b)=>b.venta-a.venta).slice(0,25);
  const c2=el('div','card');c2.appendChild(el('h2',null,'Artículos del mes'));c2.appendChild(el('p','note','Top 25 por venta.'));
  const bx=el('div','box');bx.appendChild(table(artCols,top,'porArtMes','mes,item',r=>ek(r.mes,r.item)));c2.appendChild(bx);v.appendChild(c2);
  }else if(S.sub==='horarios'){
  horBlock(v,S.mes+'-01',S.mes+'-31');
  }else cityBlock(v,'mes',S.mes);
}
function viewAnio(v){
  const rows=D.mes.map(r=>({value:r.porDia,lab:MES[+r.mes.slice(5)-1].slice(0,3),tip:monthLabel(r.mes)+' · '+fm(r.porDia)+'/día · '+fm(r.venta)}));
  const c=el('div','card');c.appendChild(el('h2',null,'Venta por día, mes a mes'));c.appendChild(el('p','note','Promedio diario de cada mes. El mes en curso llega hasta hoy (parcial).'));
  const ch=el('div',null,null,{'data-source':'porMes'});ch.style.minHeight='200px';c.appendChild(ch);v.appendChild(c);
  bars(ch,rows,{max:Math.max(d3.max(rows,r=>r.value)||1,1)*1.1});
  const tot=d3.sum(D.mes,r=>r.venta);
  v.appendChild(hero('Venta acumulada 2026',fm(tot),null,null,null));
  const c2=el('div','card');c2.appendChild(el('h2',null,'Meses'));
  const mc=[{f:'mes',h:'Mes',fmt:monthLabel},{f:'venta',h:'Venta',fmt:v=>'$ '+(v/1e6).toFixed(1).replace('.',',')+'M'},{f:'porDia',h:'Por día',fmt:v=>'$ '+(v/1e6).toFixed(2).replace('.',',')+'M'},{f:'ticket',h:'Ticket',fmt:fm}];
  c2.appendChild(table(mc,D.mes,'porMes','mes',r=>ek(r.mes)));v.appendChild(c2);
}
function render(){
  const ids=['porDia','porHora','porArtDia','porArtMes','porMes','ciudades','provDia','provMes','ciuMes'],st=ids.map(i=>dash.data(i));
  const v=document.getElementById('view'),tabs=document.getElementById('tabs');dash.recalc(S.local);const lc=document.getElementById('loc');lc.textContent='';[['todos','Todos'],['Cabildo','Cabildo'],['DOT','DOT']].forEach(([k,t])=>{const b=el('button','btn'+(S.local===k?' on':''),t);b.onclick=()=>{S.local=k;render();};lc.appendChild(b);});v.textContent='';tabs.textContent='';
  if(st.some(s=>s.status!=='ok'||!s.data||!s.data.length)){v.appendChild(el('p','note',st.some(s=>s.status==='error'||s.status==='declined')?'No se pudo cargar':'Cargando…'));return;}
  load();
  [['diario','Diario'],['mensual','Mensual'],['anual','Anual']].forEach(([k,t])=>{const b=el('button','btn'+(S.tab===k?' on':''),t);b.onclick=()=>{S.tab=k;render();};tabs.appendChild(b);});
  if(S.tab==='diario')viewDia(v);else if(S.tab==='mensual')viewMes(v);else viewAnio(v);
}
dash.onData(render);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(function(){var busy=false;
function check(){if(busy||document.visibilityState!=="visible")return;busy=true;
fetch("./?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(h){
var m=h.match(/Actualizado: ([0-9\/ :]+)/),f=document.querySelector(".foot");
if(m&&f&&f.textContent.indexOf(m[1].trim())<0)location.reload();}).catch(function(){}).then(function(){busy=false;});}
document.addEventListener("visibilitychange",check);window.addEventListener("pageshow",check);window.addEventListener("focus",check);setInterval(check,300000);})();
</script>

</body></html>
